
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Video | AfterDarkTalks</title>
  <meta name="description"
        content="Página de entretenimiento con reproductor de video y acceso opcional a un sitio asociado.">

  <meta property="og:title" content="Video | AfterDarkTalks">

        content="Mira el video y visita el sitio asociado si deseas conocer más contenido.">
  <meta property="og:image"
        content="https://i.imgur.com/Yrz7pMe.jpeg">
  <meta property="og:type" content="website">

  <meta name="robots" content="index,follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 40px;
      background: #101114;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(850px, 100%);
      margin: auto;
    }

    header {
      padding: 12px 0 24px;
      text-align: center;
    }

    .brand {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-top: 8px;
    }

    .video-box {
      background: #000;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #303238;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }

    .content {
      padding: 22px;
      margin-top: 18px;
      background: #1b1d22;
      border: 1px solid #303238;
      border-radius: 14px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    p {
      color: #bbb;
      line-height: 1.6;
      font-size: 14px;
    }

    .partner-link {
      display: inline-block;
      margin-top: 12px;
      padding: 15px 25px;
      background: #2563eb;
      color: #fff;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
    }

    .partner-link:hover {
      background: #1d4ed8;
    }

    .disclosure {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }

    footer {
      padding-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="brand">AfterDarkTalks</div>
      <div class="subtitle">Entretenimiento y videos</div>
    </header>

    <section class="video-box">
      <video
        controls
        playsinline
        preload="metadata"
        poster="https://i.imgur.com/Yrz7pMe.jpeg">

        <source
          src="https://cdn.videy.co/KUcavjzc1.mp4"
          type="video/mp4">

        Tu navegador no puede reproducir este video.

    </section>

    <section class="content">
      <h1>Contenido relacionado</h1>

      <p>

        puedes visitar nuestro sitio asociado.

      <a
        class="partner-link"
        href="https://sixstale.com/qxsczqqp?key=814cfc1b9f8fca23b6b1b6abe1e062e6"
        target="_blank"
        rel="nofollow sponsored noopener noreferrer">

        Visitar sitio asociado
      </a>

      <div class="disclosure">
        El enlace externo conduce a un sitio de terceros
        que puede mostrar publicidad.
      </div>
    </section>

    <footer>
      © 2026 AfterDarkTalks
    </footer>

</body>
